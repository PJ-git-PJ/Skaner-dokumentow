<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.svg">
<meta name="theme-color" content="#1A73E8">
<title>Skaner dokumentów</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* light-dark(jasny, ciemny) - motyw wg ustawień systemu, chyba że data-theme wymusza jeden z nich */
  :root {
    color-scheme: light dark;
    --paper: light-dark(#F1F3F6, #202124);
    --paper-raised: light-dark(#FFFFFF, #28292C);
    --card: light-dark(#FFFFFF, #2D2E30);
    --ink: light-dark(#202124, #E8EAED);
    --ink-soft: light-dark(#5F6368, #BDC1C6);
    --ink-faint: light-dark(#9AA0A6, #80868B);
    --rule: light-dark(#DADCE0, #3C4043);
    --stamp: light-dark(#1A73E8, #8AB4F8);
    --stamp-dark: light-dark(#185ABC, #669DF6);
    --stamp-ink: light-dark(#FFFFFF, #202124);
    --ok: light-dark(#1E8E3E, #81C995);
    --ok-ink: light-dark(#FFFFFF, #202124);
    --accent-yellow: light-dark(#F9AB00, #FDD663);
    --danger: light-dark(#D93025, #F28B82);
    --shadow: light-dark(rgba(32, 33, 36, 0.16), rgba(0, 0, 0, 0.5));
    --focus: var(--stamp);

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  html, body { height: 100%; }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    background-image: radial-gradient(circle at 1px 1px, var(--rule) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: "Manrope", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }

  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: 20px 18px calc(40px + env(safe-area-inset-bottom, 0px));
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: env(safe-area-inset-top, 0px) 0 0;
    margin-bottom: 22px;
  }
  header .brand { font-family: "Space Mono", monospace; font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
  header .brand span { color: var(--stamp); }
  header .step-indicator { font-family: "Space Mono", monospace; font-size: 12px; color: var(--ink-faint); }

  h1 { font-size: 26px; line-height: 1.15; margin: 0 0 6px; font-weight: 800; letter-spacing: -0.01em; }
  .sub { color: var(--ink-soft); font-size: 14.5px; line-height: 1.5; margin: 0 0 24px; max-width: 40ch; }

  .card {
    background: var(--card);
    border-radius: 3px;
    box-shadow: 0 1px 0 var(--rule), 0 10px 24px -16px var(--shadow);
    border: 1px solid var(--rule);
    padding: 18px;
    margin-bottom: 16px;
  }

  .card-title {
    font-family: "Space Mono", monospace;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--ink-faint);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title::after { content: ""; flex: 1; height: 1px; background: var(--rule); }

  /* --- capture --- */
  .capture-zone {
    display: block;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    font-family: inherit;
    color: inherit;
    border: 1.5px dashed var(--stamp);
    border-radius: 14px;
    padding: 14px 12px;
    text-align: center;
    background: var(--paper-raised);
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .capture-zone:active { background: var(--rule); }
  .capture-zone:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .capture-zone .icon { width: 36px; height: 36px; margin: 0 auto 6px; color: var(--ink-soft); }
  .capture-zone .cta { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
  .capture-zone .hint { font-size: 11px; color: var(--ink-faint); }

  #fileInput {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* --- crop --- */
  .crop-shell {
    position: relative;
    border-radius: 2px;
    overflow: hidden;
    background: #000;
    line-height: 0;
    touch-action: none;
    user-select: none;
  }
  #cropCanvas { display: block; width: 100%; height: auto; }
  .crop-box {
    position: absolute;
    border: 2px solid var(--accent-yellow);
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
    touch-action: none;
    cursor: move;
  }
  .crop-handle {
    position: absolute;
    width: 40px;
    height: 40px;
    background: var(--accent-yellow);
    border: 4px solid var(--card);
    border-radius: 50%;
    box-shadow: 0 1px 4px var(--shadow);
    touch-action: none;
  }
  .crop-handle[data-corner="tl"] { top: 0; left: 0; transform: translate(-50%, -50%); cursor: nwse-resize; }
  .crop-handle[data-corner="tr"] { top: 0; right: 0; transform: translate(50%, -50%); cursor: nesw-resize; }
  .crop-handle[data-corner="bl"] { bottom: 0; left: 0; transform: translate(-50%, 50%); cursor: nesw-resize; }
  .crop-handle[data-corner="br"] { bottom: 0; right: 0; transform: translate(50%, 50%); cursor: nwse-resize; }
  .crop-hint { font-size: 14px; color: var(--ink-faint); margin: 10px 0 0; text-align: center; }

  .preview-shell {
    position: relative;
    border-radius: 2px;
    overflow: hidden;
    background: #000;
    line-height: 0;
  }
  .preview-shell::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
    pointer-events: none;
  }
  #previewCanvas { display: block; width: 100%; height: auto; }

  .filter-row { display: flex; gap: 8px; margin-top: 12px; }

  .category-row { display: flex; gap: 6px; margin-bottom: 14px; }
  .cat-btn, .filter-btn {
    flex: 1;
    border-radius: 10px;
    border: 1px solid var(--rule);
    background: var(--paper-raised);
    color: var(--ink-soft);
    font-family: "Manrope", sans-serif;
    font-weight: 600;
    cursor: pointer;
  }
  .filter-btn { padding: 9px 6px; font-size: 13px; }
  .filter-btn[aria-pressed="true"] { background: var(--stamp); color: var(--stamp-ink); border-color: var(--stamp); }
  /* przyciski kategorii i folderów: ten sam wygląd i wysokość co .secondary-btn (np. "Wyślij e-mailem") */
  .cat-btn {
    min-width: 0;
    height: 40px;
    padding: 0 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.15;
    text-align: center;
    overflow: hidden;
    border-radius: 14px;
    border: 1.5px solid var(--stamp);
    background: transparent;
    color: var(--stamp);
  }
  .cat-btn:active { background: var(--rule); }
  .cat-btn[aria-pressed="true"] { background: var(--stamp); color: var(--stamp-ink); }
  .cat-btn[aria-pressed="true"]:active { background: var(--stamp-dark); }

  .slider-row { margin-top: 14px; }
  .slider-row label {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .slider-row label span { font-family: "Space Mono", monospace; color: var(--ink-faint); font-weight: 400; }
  input[type="range"] {
    width: 100%;
    height: 4px;
    border-radius: 999px;
    background: var(--rule);
    accent-color: var(--stamp);
    cursor: pointer;
  }

  .retake {
    margin-top: 10px;
    width: 100%;
    padding: 10px;
    background: transparent;
    border: none;
    color: var(--ink-faint);
    font-size: 13px;
    font-family: "Manrope", sans-serif;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  /* --- form --- */
  label { display: block; font-size: 14px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; margin-top: 16px; }
  label:first-of-type { margin-top: 0; }

  input[type="text"], input[type="date"], input[type="time"], textarea {
    width: 100%;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 11px 12px;
    font-family: "Manrope", sans-serif;
    font-size: 17px;
    color: var(--ink);
  }
  input[type="text"]:focus, input[type="date"]:focus, input[type="time"]:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  textarea { resize: vertical; min-height: 60px; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding-top: 4px; }
  .toggle-row .label-text { font-size: 15px; color: var(--ink-soft); font-weight: 600; margin: 0; }
  .switch {
    position: relative;
    display: inline-block;
    width: 42px;
    height: 24px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .track { position: absolute; inset: 0; background: var(--rule); border-radius: 999px; transition: background .15s ease; pointer-events: none; }
  .switch .track::after {
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 18px; height: 18px;
    background: var(--card);
    border-radius: 50%;
    transition: transform .15s ease;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .switch input:checked + .track { background: var(--focus); }
  .switch input:checked + .track::after { transform: translateX(18px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--focus); outline-offset: 2px; }

  .filename-stub {
    margin-top: 16px;
    border-top: 1px dashed var(--rule);
    padding-top: 12px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filename-stub .fx-label { font-size: 12.5px; color: var(--ink-faint); font-family: "Space Mono", monospace; }
  .filename-stub .fx-name { font-family: "Space Mono", monospace; font-size: 15px; font-weight: 700; word-break: break-all; }

  .primary-btn {
    width: 100%;
    padding: 15px;
    border-radius: 14px;
    border: none;
    background: var(--stamp);
    color: var(--stamp-ink);
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background .12s ease, transform .06s ease;
  }
  .primary-btn:active { transform: scale(0.99); background: var(--stamp-dark); }
  .primary-btn:disabled { background: var(--rule); color: var(--ink-faint); cursor: not-allowed; }
  .primary-btn.is-done { background: var(--stamp); color: var(--stamp-ink); }
  .primary-btn.is-done:active { background: var(--ok); opacity: 0.85; }

  .secondary-btn {
    display: block;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 16px;
    box-sizing: border-box;
    height: 50px;
    padding: 0 13px;
    margin-top: 14px;
    border-radius: 14px;
    border: 1.5px solid var(--stamp);
    background: transparent;
    color: var(--stamp);
    cursor: pointer;
  }
  .secondary-btn:active { background: var(--rule); }
  .secondary-btn[aria-pressed="true"] { background: var(--stamp); color: var(--stamp-ink); }
  .secondary-btn[aria-pressed="true"]:active { background: var(--stamp-dark); }

  /* panele wyboru (waluta, folder OneDrive) */
  .picker-panel { border: 1px solid var(--rule); border-radius: 12px; padding: 12px; background: var(--paper-raised); }
  .picker-list { max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .secondary-btn.list-btn { margin-top: 0; text-align: left; }
  .list-hint { margin: 0; }

  .split-row { display: flex; gap: 10px; margin-top: 12px; }
  .split-row .primary-btn, .split-row .secondary-btn { margin-top: 0; flex: 1; }

  .carousel {
    display: none;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .carousel-arrow {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--stamp);
    color: var(--stamp-ink);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  .carousel-arrow:disabled { opacity: 0.3; cursor: default; }
  .carousel-view {
    flex: 1;
    position: relative;
    border-radius: 2px;
    overflow: hidden;
    background: #000;
    line-height: 0;
  }
  .carousel-view img { width: 100%; height: 120px; object-fit: cover; display: block; }
  .carousel-label {
    position: absolute;
    bottom: 6px; left: 6px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-family: "Space Mono", monospace;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
  }
  .carousel-del {
    position: absolute;
    top: 6px; right: 6px;
    width: 38px; height: 38px;
    border: none;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    font-size: 21px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    box-shadow: 0 1px 4px var(--shadow);
  }

  .status { margin-top: 12px; font-size: 15px; text-align: center; min-height: 18px; color: var(--ink-soft); }
  .status.err { color: var(--danger); }
  .status.ok { color: var(--ok); }

  .note {
    font-size: 12.5px;
    color: var(--ink-faint);
    line-height: 1.5;
    padding: 14px 16px;
    border-radius: 3px;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
  }
  .note b { color: var(--ink-soft); }

  canvas { max-width: 100%; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">SKANER<span>·</span>DOK</div>
    <div class="step-indicator" id="stepIndicator">KROK 1/3</div>
  </header>

  <!-- CAPTURE + CROP (jeden krok) -->
  <div class="card" id="captureCard">
    <p class="card-title" id="captureCardTitle">ZDJĘCIE</p>

    <div id="captureSection">
      <button type="button" class="capture-zone" id="captureZone">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M4 8.5C4 7.67 4.67 7 5.5 7H7.8L8.6 5.4C8.83 4.94 9.3 4.65 9.82 4.65H14.18C14.7 4.65 15.17 4.94 15.4 5.4L16.2 7H18.5C19.33 7 20 7.67 20 8.5V17.5C20 18.33 19.33 19 18.5 19H5.5C4.67 19 4 18.33 4 17.5V8.5Z"/>
          <circle cx="12" cy="13" r="3.4"/>
        </svg>
        <div class="cta">Zrób zdjęcie dokumentu</div>
      </button>
      <input type="file" id="fileInput" accept="image/*" capture="environment">
    </div>

    <div id="cropSection" style="display:none;">
      <div class="crop-shell" id="cropShell">
        <canvas id="cropCanvas"></canvas>
        <div class="crop-box" id="cropBox">
          <div class="crop-handle" data-corner="tl"></div>
          <div class="crop-handle" data-corner="tr"></div>
          <div class="crop-handle" data-corner="bl"></div>
          <div class="crop-handle" data-corner="br"></div>
        </div>
      </div>
      <p class="crop-hint" id="cropHint">Przeciągnij rogi, aby dopasować kadr, albo przesuń całą ramkę.</p>
      <div class="split-row">
        <button type="button" class="primary-btn" id="cropApplyBtn">Przytnij</button>
        <button type="button" class="secondary-btn" id="cropRetakeBtn">Zrób ponownie</button>
      </div>
      <div class="split-row">
        <button type="button" class="primary-btn" id="autoDetectBtn">Wykryj kraw.</button>
        <button type="button" class="secondary-btn" id="cropSkipBtn">Pomiń kadrowanie</button>
      </div>
    </div>
  </div>

  <!-- FORM -->
  <div class="card" id="formCard">
    <p class="card-title">OPIS DOKUMENTU</p>

    <label for="nazwaInput">Nazwa</label>
    <input type="text" id="nazwaInput" placeholder="np. Paragon Biedronka" maxlength="80">

    <label style="margin-top:16px;">Kwota (opcjonalnie)</label>
    <div style="display:flex; gap:10px;">
      <input type="text" id="amountInput" inputmode="decimal" placeholder="0,00" style="flex:1;">
      <button type="button" class="secondary-btn" id="currencyToggleBtn" aria-pressed="false" style="margin-top:0; flex:0 0 84px;">PLN</button>
    </div>

    <div class="picker-panel" id="currencyPickerPanel" style="display:none;">
      <input type="text" id="currencySearchInput" placeholder="Szukaj waluty (np. EUR)" style="margin-bottom:10px;">
      <div class="picker-list" id="currencyList"></div>
      <button type="button" class="retake" id="currencyCancelBtn">Anuluj</button>
    </div>

    <label for="opisInput">Opis (opcjonalnie)</label>
    <textarea id="opisInput" placeholder="np. Zakupy spożywcze, do rozliczenia"></textarea>

    <div class="toggle-row">
      <p class="label-text">Dodaj godzinę do nazwy pliku</p>
      <label class="switch">
        <input type="checkbox" id="timeToggle" checked>
        <span class="track"></span>
      </label>
    </div>

    <div class="toggle-row">
      <p class="label-text">Ustaw datę/godzinę ręcznie</p>
      <label class="switch">
        <input type="checkbox" id="manualDateToggle">
        <span class="track"></span>
      </label>
    </div>

    <div id="manualDateTimeRow" style="display:none; gap:10px;">
      <div style="flex:1;">
        <label for="manualDateInput">Data</label>
        <input type="date" id="manualDateInput">
      </div>
      <div style="flex:1;">
        <label for="manualTimeInput">Godzina</label>
        <input type="time" id="manualTimeInput">
      </div>
    </div>

    <div class="category-row" id="categoryRow" style="margin-top:16px;">
      <button type="button" class="cat-btn" data-category="Karta PJ" aria-pressed="false">Karta PJ</button>
      <button type="button" class="cat-btn" data-category="Cash PJ" aria-pressed="false">Cash PJ</button>
      <button type="button" class="cat-btn" data-category="Karta PJB" aria-pressed="false">Karta PJB</button>
      <button type="button" class="cat-btn" data-category="Karta M2M" aria-pressed="false">Karta M2M</button>
    </div>

    <label style="margin-top:20px;">Zapis do folderów OneDrive</label>
    <div class="category-row" id="oneDriveRow" style="margin-bottom:6px;">
      <button type="button" class="cat-btn od-btn" aria-pressed="false">Folder 1</button>
      <button type="button" class="cat-btn od-btn" aria-pressed="false">Folder 2</button>
      <button type="button" class="cat-btn od-btn" aria-pressed="false">Folder 3</button>
      <button type="button" class="cat-btn od-btn" aria-pressed="false">Folder 4</button>
    </div>
    <p class="crop-hint" id="msAccountText" style="display:none;"></p>
    <p class="crop-hint" id="oneDriveActiveFolderText" style="display:none; text-align:left; margin-top:4px;"></p>

    <label style="margin-top:20px;">Zapisywanie po wygenerowaniu PDF</label>
    <button type="button" class="secondary-btn" id="emailToggleBtn" aria-pressed="false" style="margin-top:0;">Wyślij e-mailem</button>
    <button type="button" class="secondary-btn" id="localSaveToggleBtn" aria-pressed="true">Zapis w telefonie</button>

    <div class="picker-panel" id="oneDrivePickerPanel" style="display:none; margin-top:10px;">
      <p class="crop-hint" id="pickerTitleText" style="margin:0 0 4px; text-align:left; font-weight:700;"></p>
      <p class="crop-hint" id="pickerPathText" style="margin:0 0 10px; text-align:left;">Dysk główny</p>
      <div class="picker-list" id="pickerList"></div>
      <button type="button" class="secondary-btn" id="pickerNewFolderBtn" style="margin-top:10px;">+ Nowy folder tutaj</button>
      <button type="button" class="primary-btn" id="pickerSelectBtn" style="margin-top:10px;">Wybierz ten folder</button>
      <button type="button" class="retake" id="pickerCancelBtn">Anuluj</button>
    </div>

    <div class="filename-stub">
      <span class="fx-label">NAZWA PLIKU →</span>
      <span class="fx-name" id="filenamePreview">—</span>
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="card" id="previewCard" style="display:none;">
    <p class="card-title">OPTYMALIZACJA</p>

    <div class="carousel" id="pagesCarousel">
      <button type="button" class="carousel-arrow" id="carouselPrev" aria-label="Poprzednia strona">‹</button>
      <div class="carousel-view">
        <img id="carouselImg" alt="Podgląd zapisanej strony">
        <span class="carousel-label" id="carouselLabel">Strona 1 z 1</span>
        <button type="button" class="carousel-del" id="carouselDelBtn" aria-label="Usuń tę stronę">×</button>
      </div>
      <button type="button" class="carousel-arrow" id="carouselNext" aria-label="Następna strona">›</button>
    </div>

    <div class="preview-shell">
      <canvas id="previewCanvas"></canvas>
    </div>
    <div class="filter-row">

<script>
(function () {
  "use strict";

  // ---------- funkcje pomocnicze ----------
  // localStorage może być niedostępny (tryb prywatny, zablokowane dane) - wtedy po prostu nie zapamiętujemy
  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* ignoruj */ }
  }

  function isOn(btn) { return btn.getAttribute('aria-pressed') === 'true'; }
  function setOn(btn, on) { btn.setAttribute('aria-pressed', String(on)); }
  // przełącznik on/off zapamiętywany pod podanym kluczem
  function setToggle(btn, key, on) { setOn(btn, on); save(key, String(on)); }

  // Krótkie kliknięcie -> tap(), przytrzymanie -> longPress() (bez wywoływania tap)
  const LONG_PRESS_MS = 550;
  function onPress(btn, { tap, longPress }) {
    let timer = null;
    let fired = false;
    const cancel = () => clearTimeout(timer);
    btn.addEventListener('pointerdown', () => {
      fired = false;
      timer = setTimeout(() => {
        fired = true;
        if (navigator.vibrate) navigator.vibrate(15);
        longPress();
      }, LONG_PRESS_MS);
    });
    btn.addEventListener('pointerup', cancel);
    btn.addEventListener('pointerleave', cancel);
    btn.addEventListener('pointercancel', cancel);
    btn.addEventListener('click', () => {
      if (fired) { fired = false; return; }
      tap();
    });
  }

  // przycisk na liście w panelu wyboru (waluta, folder)
  function makeListBtn(text, onClick, pressed) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'secondary-btn list-btn';
    btn.textContent = text;
    if (pressed !== undefined) setOn(btn, pressed);
    btn.addEventListener('click', onClick);
    return btn;
  }
  function listHint(text) {
    const p = document.createElement('p');
    p.className = 'crop-hint list-hint';
    p.textContent = text;
    return p;
  }

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtDate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function fmtTime(d, sep = ':') { return `${pad(d.getHours())}${sep}${pad(d.getMinutes())}`; }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  // ---------- obsługa gestu/przycisku "wstecz" ----------
  // Bez tego pojedyncza strona nie ma własnej historii, więc gest cofania od razu
  // zamyka appkę. Utrzymujemy w historii przeglądarki jeden "bufor" - cofnięcie
  // konsumuje go i wraca do poprzedniego EKRANU w appce (kadrowanie/zdjęcie), a nie
  // wychodzi z niej. Dopiero na samym ekranie startowym (brak wcześniejszych kroków)
  // kolejne cofnięcie działa normalnie i zamyka/cofa stronę.
  let currentStep = 'capture';
  function armBackGesture() {
    try { history.pushState({ appBuffer: true }, '', location.href); } catch (e) { /* ignoruj */ }
  }
  armBackGesture();
  window.addEventListener('popstate', () => {
    if (currentStep === 'optimize') {
      showCropStep(true);
      armBackGesture();
    } else if (currentStep === 'crop') {
      goToCaptureStep(false);
      armBackGesture();
    }
    // na ekranie startowym ('capture') nic nie robimy - pozwalamy, żeby kolejne
    // cofnięcie zadziałało normalnie (zamknięcie appki / wyjście)
  });

  const fileInput = document.getElementById('fileInput');
  const captureCard = document.getElementById('captureCard');
  const captureZone = document.getElementById('captureZone');
  const captureCardTitle = document.getElementById('captureCardTitle');
  const captureSection = document.getElementById('captureSection');

  const cropBox = document.getElementById('cropBox');
  const cropApplyBtn = document.getElementById('cropApplyBtn');
  const cropSkipBtn = document.getElementById('cropSkipBtn');
  const cropRetakeBtn = document.getElementById('cropRetakeBtn');
  const autoDetectBtn = document.getElementById('autoDetectBtn');
  const cropHint = document.getElementById('cropHint');
  const contrastSlider = document.getElementById('contrastSlider');
  const contrastValue = document.getElementById('contrastValue');
  const previewCard = document.getElementById('previewCard');
  const formCard = document.getElementById('formCard');
  const actionCard = document.getElementById('actionCard');
  const previewCanvas = document.getElementById('previewCanvas');
  const ctx = previewCanvas.getContext('2d');
  const retakeBtn = document.getElementById('retakeBtn');
  const backToCropBtn = document.getElementById('backToCropBtn');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const nazwaInput = document.getElementById('nazwaInput');
  const opisInput = document.getElementById('opisInput');

  // ---------- kwota i waluta ----------
  const amountInput = document.getElementById('amountInput');
  const currencyToggleBtn = document.getElementById('currencyToggleBtn');
  const currencyPickerPanel = document.getElementById('currencyPickerPanel');
  const currencySearchInput = document.getElementById('currencySearchInput');
  const currencyList = document.getElementById('currencyList');
  const currencyCancelBtn = document.getElementById('currencyCancelBtn');
  const CURRENCY_KEY = 'skanerSelectedCurrency';
  const AMOUNT_ENABLED_KEY = 'skanerAmountEnabled';
  const DEFAULT_CURRENCY = 'PLN';
  const BASE_CURRENCIES = ['PLN', 'EUR', 'USD'];
  // Pełna lista aktywnych kodów walut ISO 4217 (wszystkie waluty świata)
  const ALL_CURRENCIES = ['AED','AFN','ALL','AMD','ANG','AOA','ARS','AUD','AWG','AZN','BAM','BBD','BDT','BGN','BHD','BIF','BMD','BND','BOB','BRL','BSD','BTN','BWP','BYN','BZD','CAD','CDF','CHF','CLP','CNY','COP','CRC','CUP','CVE','CZK','DJF','DKK','DOP','DZD','EGP','ERN','ETB','EUR','FJD','FKP','GBP','GEL','GHS','GIP','GMD','GNF','GTQ','GYD','HKD','HNL','HTG','HUF','IDR','ILS','INR','IQD','IRR','ISK','JMD','JOD','JPY','KES','KGS','KHR','KMF','KPW','KRW','KWD','KYD','KZT','LAK','LBP','LKR','LRD','LSL','LYD','MAD','MDL','MGA','MKD','MMK','MNT','MOP','MRU','MUR','MVR','MWK','MXN','MYR','MZN','NAD','NGN','NIO','NOK','NPR','NZD','OMR','PAB','PEN','PGK','PHP','PKR','PLN','PYG','QAR','RON','RSD','RUB','RWF','SAR','SBD','SCR','SDG','SEK','SGD','SHP','SLE','SOS','SRD','SSP','STN','SYP','SZL','THB','TJS','TMT','TND','TOP','TRY','TTD','TWD','TZS','UAH','UGX','USD','UYU','UZS','VES','VND','VUV','WST','XAF','XCD','XOF','XPF','YER','ZAR','ZMW','ZWL'];

  function getSelectedCurrency() { return load(CURRENCY_KEY, DEFAULT_CURRENCY); }
  function setSelectedCurrency(code) {
    save(CURRENCY_KEY, code);
    currencyToggleBtn.textContent = code;
  }
  currencyToggleBtn.textContent = getSelectedCurrency();
  if (load(AMOUNT_ENABLED_KEY) === 'true') setOn(currencyToggleBtn, true);

  function buildCurrencyOrder() {
    const lastUsed = getSelectedCurrency();
    let others = ALL_CURRENCIES.filter(c => !BASE_CURRENCIES.includes(c)).sort((a, b) => a.localeCompare(b));
    let list = BASE_CURRENCIES.slice();
    if (lastUsed && !BASE_CURRENCIES.includes(lastUsed)) {
      others = others.filter(c => c !== lastUsed);
      list.push(lastUsed); // ostatnio wybrana waluta wskakuje jako 4. pozycja
    }
    return list.concat(others);
  }

  function renderCurrencyList(query) {
    const current = getSelectedCurrency();
    const q = (query || '').trim().toUpperCase();
    const full = buildCurrencyOrder();
    const filtered = q ? full.filter(code => code.includes(q)) : full;
    const items = filtered.map(code => makeListBtn(code, () => {
      setSelectedCurrency(code);
      currencyPickerPanel.style.display = 'none';
      refreshFilenamePreview();
    }, code === current));
    currencyList.replaceChildren(...(items.length ? items : [listHint('Brak wyników.')]));
  }

  currencySearchInput.addEventListener('input', () => {
    renderCurrencyList(currencySearchInput.value);
  });

  currencyCancelBtn.addEventListener('click', () => { currencyPickerPanel.style.display = 'none'; });

  // kwota z pola tekstowego (akceptuje przecinek); null, gdy pusta lub niepoprawna
  function parseAmount() {
    const num = parseFloat(amountInput.value.replace(/[\s ]/g, '').replace(',', '.'));
    return isNaN(num) ? null : num;
  }
  // 1234567.5 -> "1 234 567,50" (separator tysięcy: zwykła spacja, bezpieczna w nazwie pliku)
  function groupThousands(intDigits) { return intDigits.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function formatAmount(num) {
    const [int, dec] = Math.abs(num).toFixed(2).split('.');
    return (num < 0 ? '-' : '') + groupThousands(int) + ',' + dec;
  }

  // formatowanie na żywo podczas wpisywania: grupowanie tysięcy, część dziesiętna bez zmian
  amountInput.addEventListener('input', () => {
    const el = amountInput;
    const raw = el.value;
    const caret = el.selectionStart;
    const sigBefore = raw.slice(0, caret).replace(/[^\d,.]/g, '').length; // znaczące znaki przed kursorem
    const cleaned = raw.replace(/\./g, ',').replace(/[^\d,]/g, '');
    const commaAt = cleaned.indexOf(',');
    const intPart = (commaAt === -1 ? cleaned : cleaned.slice(0, commaAt)).replace(/^0+(?=\d)/, '');
    const decPart = commaAt === -1 ? null : cleaned.slice(commaAt + 1).replace(/,/g, '').slice(0, 2);
    const out = groupThousands(intPart) + (decPart === null ? '' : ',' + decPart);
    if (out === raw) return;
    el.value = out;
    let pos = 0, seen = 0;
    while (pos < out.length && seen < sigBefore) { if (/[\d,]/.test(out[pos])) seen++; pos++; }
    el.setSelectionRange(pos, pos);
  });

  amountInput.addEventListener('blur', () => {
    if (!amountInput.value.trim()) return;
    const num = parseAmount();
    amountInput.value = num === null ? '' : formatAmount(num);
  });

  onPress(currencyToggleBtn, {
    longPress: () => {
      currencySearchInput.value = '';
      renderCurrencyList('');
      currencyPickerPanel.style.display = '';
      currencySearchInput.focus();
    },
    tap: () => setToggle(currencyToggleBtn, AMOUNT_ENABLED_KEY, !isOn(currencyToggleBtn))
  });

  function getAmountLine() {
    if (!isOn(currencyToggleBtn)) return null;
    const num = parseAmount();
    return num === null ? null : `Kwota: ${formatAmount(num)} ${getSelectedCurrency()}`;
  }
  const timeToggle = document.getElementById('timeToggle');
  const TIME_ENABLED_KEY = 'skanerTimeEnabled';
  timeToggle.checked = load(TIME_ENABLED_KEY, 'true') === 'true';
  timeToggle.addEventListener('change', () => save(TIME_ENABLED_KEY, String(timeToggle.checked)));
  const manualDateToggle = document.getElementById('manualDateToggle');
  const manualDateTimeRow = document.getElementById('manualDateTimeRow');
  const manualDateInput = document.getElementById('manualDateInput');
  const manualTimeInput = document.getElementById('manualTimeInput');
  const filenamePreview = document.getElementById('filenamePreview');
  const generateBtn = document.getElementById('generateBtn');
  const categoryBtns = document.querySelectorAll('.cat-btn:not(.od-btn)');
  let selectedCategory = null;

  // ---------- wysyłanie e-mailem (szkic mailto) - przycisk on/off jak zapis w telefonie/OneDrive ----------
  const emailToggleBtn = document.getElementById('emailToggleBtn');
  const EMAIL_ENABLED_KEY = 'skanerEmailEnabled';
  const EMAIL_ADDRESS_KEY = 'skanerEmailAddress';

  function getEmailAddress() { return load(EMAIL_ADDRESS_KEY, ''); }
  function isValidEmail(addr) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(addr);
  }
  function updateEmailButton() {
    const addr = getEmailAddress();
    emailToggleBtn.textContent = isOn(emailToggleBtn) && addr ? addr : 'Wyślij e-mailem';
  }
  function setEmailEnabled(enabled) {
    setToggle(emailToggleBtn, EMAIL_ENABLED_KEY, enabled);
    updateEmailButton();
  }

  if (load(EMAIL_ENABLED_KEY) === 'true' && getEmailAddress()) setOn(emailToggleBtn, true);
  updateEmailButton();

  // pyta o adres; zwraca true, gdy zapisano poprawny
  function promptForEmailAddress(question) {
    const next = (window.prompt(question, getEmailAddress()) || '').trim();
    if (!next) return false; // anulowano albo puste
    if (!isValidEmail(next)) { showStatus('Niepoprawny adres e-mail.', 'err'); return false; }
    save(EMAIL_ADDRESS_KEY, next);
    updateEmailButton();
    return true;
  }

  onPress(emailToggleBtn, {
    longPress: () => promptForEmailAddress('Adres e-mail do wysyłki:'),
    tap: () => {
      if (isOn(emailToggleBtn)) { setEmailEnabled(false); return; }
      if (!getEmailAddress() && !promptForEmailAddress('Podaj adres e-mail do wysyłki:')) return;
      setEmailEnabled(true);
    }
  });

  function openEmailDraft(fname) {
    const addr = getEmailAddress();
    if (!isValidEmail(addr)) {
      showStatus('Zapisano PDF, ale nie otwarto e-maila — sprawdź adres e-mail.', 'err');
      return;
    }
    const subject = encodeURIComponent(`Skan: ${fname}`);
    const body = encodeURIComponent(
      `W załączniku: ${fname}\n\n` +
      `Plik znajduje się w folderze Pobrane na telefonie — dołącz go ręcznie przed wysłaniem ` +
      `(przeglądarka nie może zrobić tego automatycznie).`
    );
    window.location.href = `mailto:${addr}?subject=${subject}&body=${body}`;
  }

  // ---------- niestandardowe nazwy przyciskow kategorii (zapamietane lokalnie w tej przegladarce) ----------
  const CAT_LABELS_KEY = 'skanerCategoryLabels';
  const SELECTED_CATEGORY_KEY = 'skanerSelectedCategory';

  function saveCategoryLabels() {
    save(CAT_LABELS_KEY, JSON.stringify(Array.from(categoryBtns, b => b.dataset.category)));
  }

  try {
    const labels = JSON.parse(load(CAT_LABELS_KEY, 'null'));
    if (Array.isArray(labels)) {
      categoryBtns.forEach((b, i) => {
        if (labels[i]) { b.textContent = labels[i]; b.dataset.category = labels[i]; }
      });
    }
  } catch (e) { /* zignoruj uszkodzony zapis */ }

  function renameCategoryBtn(btn) {
    const current = btn.dataset.category;
    const next = window.prompt('Nowa nazwa tego przycisku:', current);
    if (next === null) return;
    const trimmed = next.trim();
    if (!trimmed || trimmed === current) return;
    btn.textContent = trimmed;
    btn.dataset.category = trimmed;
    if (selectedCategory === current) {
      selectedCategory = trimmed;
      save(SELECTED_CATEGORY_KEY, trimmed);
    }
    saveCategoryLabels();
  }

  categoryBtns.forEach(btn => onPress(btn, {
    longPress: () => renameCategoryBtn(btn),
    tap: () => {
      const wasActive = isOn(btn);
      categoryBtns.forEach(b => setOn(b, false));
      selectedCategory = wasActive ? null : btn.dataset.category;
      if (selectedCategory) setOn(btn, true);
      save(SELECTED_CATEGORY_KEY, selectedCategory || '');
    }
  }));

  // przywróć zapamiętaną kategorię (po ewentualnym wczytaniu zmienionych nazw przyciskow wyzej)
  const savedCategory = load(SELECTED_CATEGORY_KEY, '');
  categoryBtns.forEach(b => {
    if (savedCategory && b.dataset.category === savedCategory) {
      setOn(b, true);
      selectedCategory = savedCategory;
    }
  });
  const statusMsg = document.getElementById('statusMsg');

  // ---------- dziennik zapisów (Excel) - lokalny zapas na wypadek braku logowania Microsoft ----------
  const LOG_HEADERS = ['Data zapisu', 'Plik', 'Nazwa', 'Opis', 'Płatność', 'Kwota', 'Waluta', 'Liczba stron', 'Przycisk OneDrive', 'Folder OneDrive'];
  const LOCAL_LOG_KEY = 'skanerLogEntries';

  const isTopLevel = (() => {
    try { return window.self === window.top; } catch (e) { return false; }
  })();

  function appendLocalLogEntry(row) {
    try {
      const arr = JSON.parse(load(LOCAL_LOG_KEY, '[]'));
      arr.push(row);
      if (arr.length > 3000) arr.splice(0, arr.length - 3000);
      save(LOCAL_LOG_KEY, JSON.stringify(arr));
    } catch (e) { /* uszkodzony zapis */ }
  }

  // ---------- Microsoft (OneDrive / Outlook przez Graph API) ----------
  const MS_CLIENT_ID = '380216a8-e5e3-4253-b62a-c1a9c36470c7';

  // Zawsze zwraca adres z ukośnikiem na końcu, niezależnie od tego, jak dokładnie
  // otwarto stronę (np. bez "/" na końcu, albo z "/index.html") - musi dokładnie
  // pasować do adresu zarejestrowanego w Azure (Authentication -> Redirect URIs).
  function getRedirectUri() {
    let path = window.location.pathname;
    if (!path.endsWith('/')) {
      path = path.substring(0, path.lastIndexOf('/') + 1);
    }
    return window.location.origin + path;
  }
  const oneDriveBtns = document.querySelectorAll('.od-btn');
  const localSaveToggleBtn = document.getElementById('localSaveToggleBtn');
  const msAccountText = document.getElementById('msAccountText');
  const oneDriveActiveFolderText = document.getElementById('oneDriveActiveFolderText');
  const oneDrivePickerPanel = document.getElementById('oneDrivePickerPanel');
  const pickerTitleText = document.getElementById('pickerTitleText');
  const pickerPathText = document.getElementById('pickerPathText');
  const pickerList = document.getElementById('pickerList');
  const pickerNewFolderBtn = document.getElementById('pickerNewFolderBtn');
  const pickerSelectBtn = document.getElementById('pickerSelectBtn');
  const pickerCancelBtn = document.getElementById('pickerCancelBtn');
  const ONEDRIVE_SLOTS_KEY = 'skanerOneDriveSlots';
  const ONEDRIVE_SELECTED_SLOT_KEY = 'skanerOneDriveSelectedSlot';
  const ONEDRIVE_DEFAULT_FOLDER = 'Skaner dokumentow';
  const LOCAL_SAVE_ENABLED_KEY = 'skanerLocalSaveEnabled';

  let msalInstance = null;
  let msalAccount = null;
  const supportsMSAL = isTopLevel && typeof window.msal !== 'undefined';

  // "Zapis w telefonie" - domyślnie włączony
  setOn(localSaveToggleBtn, load(LOCAL_SAVE_ENABLED_KEY, 'true') === 'true');
  localSaveToggleBtn.addEventListener('click', () => {
    setToggle(localSaveToggleBtn, LOCAL_SAVE_ENABLED_KEY, !isOn(localSaveToggleBtn));
  });

  // ---------- cztery przyciski zapisu OneDrive: nazwa + folder, wybierane alternatywnie ----------
  let oneDriveSlots = Array.from(oneDriveBtns, b => ({ label: b.textContent, folder: ONEDRIVE_DEFAULT_FOLDER }));
  try {
    const saved = JSON.parse(load(ONEDRIVE_SLOTS_KEY, 'null'));
    if (Array.isArray(saved) && saved.length === oneDriveSlots.length) {
      oneDriveSlots = oneDriveSlots.map((def, i) => ({
        label: (saved[i] && saved[i].label) || def.label,
        folder: saved[i] && typeof saved[i].folder === 'string' ? saved[i].folder : def.folder
      }));
    }
  } catch (e) { /* zignoruj uszkodzony zapis */ }
  oneDriveBtns.forEach((b, i) => { b.textContent = oneDriveSlots[i].label; });

  let selectedOneDriveSlot = null; // indeks wybranego przycisku albo null (zapis na OneDrive wyłączony)

  function saveOneDriveSlots() { save(ONEDRIVE_SLOTS_KEY, JSON.stringify(oneDriveSlots)); }
  function folderSegments(raw) { return (raw || '').split('/').map(s => s.trim()).filter(Boolean); }
  function getOneDriveFolderSegments() {
    return selectedOneDriveSlot === null ? [] : folderSegments(oneDriveSlots[selectedOneDriveSlot].folder);
  }
  // nazwa i folder wybranego przycisku (do metryki PDF i dziennika Excel); null, gdy OneDrive wyłączony
  function getActiveOneDriveInfo() {
    if (selectedOneDriveSlot === null) return null;
    const slot = oneDriveSlots[selectedOneDriveSlot];
    return { label: slot.label, folder: folderSegments(slot.folder).join('/') || 'Dysk główny' };
  }

  // zakodowana ścieżka pliku w wybranym folderze OneDrive
  function oneDriveItemPath(filename) {
    return [...getOneDriveFolderSegments(), filename].map(encodeURIComponent).join('/');
  }

  function updateOneDriveStatus() {
    const info = getActiveOneDriveInfo();
    if (info && msalAccount) {
      msAccountText.textContent = `Zalogowano jako: ${msalAccount.username}`;
      msAccountText.style.display = '';
    } else {
      msAccountText.style.display = 'none';
    }
    oneDriveActiveFolderText.textContent = info ? `📁 ${info.label} → ${info.folder}` : '';
    oneDriveActiveFolderText.style.display = info ? '' : 'none';
  }

  function selectOneDriveSlot(i) {
    oneDriveBtns.forEach((b, j) => setOn(b, j === i));
    selectedOneDriveSlot = i;
    save(ONEDRIVE_SELECTED_SLOT_KEY, i === null ? '' : String(i));
    updateOneDriveStatus();
  }

  // ---------- Microsoft Graph ----------
  const GRAPH_ME = 'https://graph.microsoft.com/v1.0/me';

  // URL elementu OneDrive; encodedPath '' = dysk główny, suffix np. 'children' / 'content'
  function driveUrl(encodedPath, suffix) {
    if (!encodedPath) return `${GRAPH_ME}/drive/root${suffix ? '/' + suffix : ''}`;
    return `${GRAPH_ME}/drive/root:/${encodedPath}${suffix ? ':/' + suffix : ''}`;
  }

  // fetch z tokenem; json -> wysyłany jako application/json, body + contentType -> surowe dane
  async function graph(url, { scope = 'Files.ReadWrite', method = 'GET', json, body, contentType } = {}) {
    const token = await getMsToken([scope]);
    if (!token) throw new Error('Brak tokenu ' + scope);
    const headers = { 'Authorization': `Bearer ${token}` };
    if (json !== undefined) {
      headers['Content-Type'] = 'application/json';
      body = JSON.stringify(json);

  async function ensureOneDriveFolder() {

  // Dziennik .xlsx trzymany bezpośrednio w tym samym folderze OneDrive co PDF-y (odczyt-dopisz-zapis przez Graph API)
  async function appendRowToOneDriveLog(row) {
    await ensureOneDriveFolder();
    const logUrl = driveUrl(oneDriveItemPath('dziennik-skanera.xlsx'), 'content');

    let rows = [LOG_HEADERS];
    const getRes = await graph(logUrl);
    if (getRes.ok) {
      try {
        const wb = XLSX.read(await getRes.arrayBuffer(), { type: 'array' });
        const existing = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
        if (existing.length) {
          rows = existing;
          rows[0] = LOG_HEADERS; // starsze dzienniki nie mają kolumn OneDrive
        }
      } catch (e) { /* nie udało się odczytać istniejącej treści - zaczynamy od nagłówków */ }
    } else if (getRes.status !== 404) {
      throw new Error('Odczyt dziennika OneDrive nieudany: ' + getRes.status);
    }

    rows.push([row.savedAt, row.filename, row.nazwa, row.opis, row.category, row.amount, row.currency, row.pages, row.oneDriveLabel, row.oneDriveFolder]);
    const wb2 = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(rows);
    for (let r = 1; r < rows.length; r++) { // kolumna F (Kwota): format z separatorem tysięcy
      const cell = ws[XLSX.utils.encode_cell({ r, c: 5 })];
      if (cell && cell.t === 'n') cell.z = '#,##0.00';
    }
    XLSX.utils.book_append_sheet(wb2, ws, 'Dziennik');

    const putRes = await graph(logUrl, {
      method: 'PUT',
      body: XLSX.write(wb2, { type: 'array', bookType: 'xlsx' }),
      contentType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    });
    if (!putRes.ok) throw new Error('Zapis dziennika OneDrive nieudany: ' + putRes.status);
  }

  async function saveFile(filename, blob) {

    if (window.claude && typeof window.claude.use === 'function') {

      } catch (e) { /* przejdź do standardowego pobierania */ }
    }
    // Poza Claude (zwykła strona / zainstalowana PWA): standardowe pobieranie przeglądarki
    try {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return true;
    } catch (e) {
      return false;
    }
  }

  // Szacuje ramkę dokumentu dwiema metodami i wybiera lepszy wynik:
  // A) różnica koloru względem ramki brzegowej (dobre dla jednolitego tła)
  // B) jasność + największa spójna "plama" (dobre, gdy dokument jest jasny na ciemnym,
  //    nierównym tle - np. odbicia w lustrze, cienie, faktura blatu)
  // Dla zdjęć "kadr w kadr" (dokument wypełnia cały obraz) zwraca null.
  function estimateAutoCrop(sourceCanvas) {
    const SW = 260; // szerokość roboczej miniatury - kompromis dokładność/szybkość
    const scale = SW / sourceCanvas.width;
    const SH = Math.max(1, Math.round(sourceCanvas.height * scale));

    const tmp = document.createElement('canvas');
    tmp.width = SW; tmp.height = SH;
    const tctx = tmp.getContext('2d');
    tctx.drawImage(sourceCanvas, 0, 0, SW, SH);
    const data = tctx.getImageData(0, 0, SW, SH).data;

    const at = (x, y) => {
      const i = (y * SW + x) * 4;
      return [data[i], data[i + 1], data[i + 2]];
    };

    const gray = new Float32Array(SW * SH);
    for (let y = 0; y < SH; y++) {
      for (let x = 0; x < SW; x++) {
        const [r, g, b] = at(x, y);
        gray[y * SW + x] = 0.299 * r + 0.587 * g + 0.114 * b;
      }
    }

    const toFrac = (box) => {
      let fLeft = box.left / SW, fTop = box.top / SH, fRight = (box.right + 1) / SW, fBottom = (box.bottom + 1) / SH;
      const padX = (fRight - fLeft) * 0.03;
      const padY = (fBottom - fTop) * 0.03;
      fLeft = Math.max(0, fLeft - padX);
      fTop = Math.max(0, fTop - padY);
      fRight = Math.min(1, fRight + padX);
      fBottom = Math.min(1, fBottom + padY);
      return { left: fLeft, top: fTop, right: fRight, bottom: fBottom };
    };

    // ---------- METODA A: różnica względem koloru ramki brzegowej ----------
    const detectByBorderDiff = () => {
      const band = Math.max(3, Math.round(Math.min(SW, SH) * 0.05));
      let br = 0, bg = 0, bb = 0, n = 0;
      const sampleBand = (x, y) => { const [r, g, b] = at(x, y); br += r; bg += g; bb += b; n++; };
      for (let x = 0; x < SW; x += 2) {
        for (let y = 0; y < band; y++) sampleBand(x, y);
        for (let y = SH - band; y < SH; y++) sampleBand(x, y);
      }
      for (let y = band; y < SH - band; y += 2) {
        for (let x = 0; x < band; x++) sampleBand(x, y);
        for (let x = SW - band; x < SW; x++) sampleBand(x, y);
      }
      br /= n; bg /= n; bb /= n;

      const diffMap = new Float32Array(SW * SH);
      for (let y = 0; y < SH; y++) {
        for (let x = 0; x < SW; x++) {
          const [r, g, b] = at(x, y);
          diffMap[y * SW + x] = Math.max(Math.abs(r - br), Math.abs(g - bg), Math.abs(b - bb));
        }
      }
      const smooth = (arr) => arr.map((v, i) => (arr[Math.max(0, i - 1)] + v + arr[Math.min(arr.length - 1, i + 1)]) / 3);

      const tryThreshold = (THRESH) => {
        const rowSum = new Array(SH).fill(0);
        const colSum = new Array(SW).fill(0);
        for (let y = 0; y < SH; y++) {
          for (let x = 0; x < SW; x++) {
            if (diffMap[y * SW + x] > THRESH) { rowSum[y]++; colSum[x]++; }
          }
        }
        const rowSmooth = smooth(rowSum);
        const colSmooth = smooth(colSum);
        const maxRow = Math.max(...rowSmooth);
        const maxCol = Math.max(...colSmooth);
        if (maxRow < SW * 0.04 || maxCol < SH * 0.04) return null;
        const rowT = maxRow * 0.14, colT = maxCol * 0.14;
        let top = 0, bottom = SH - 1, left = 0, right = SW - 1;
        while (top < SH && rowSmooth[top] < rowT) top++;
        while (bottom > 0 && rowSmooth[bottom] < rowT) bottom--;
        while (left < SW && colSmooth[left] < colT) left++;
        while (right > 0 && colSmooth[right] < colT) right--;
        if (top >= bottom || left >= right) return null;
        const area = ((right - left) / SW) * ((bottom - top) / SH);
        if (area < 0.06 || area > 0.97) return null;
        return { left, top, right, bottom, area, score: area > 0.9 ? 0.3 : 0.55 };
      };

      for (const THRESH of [28, 38, 50, 65]) {
        const res = tryThreshold(THRESH);
        if (res) return res;
      }
      return null;
    };

    // ---------- METODA B: jasność + największa spójna plama (Otsu + flood fill) ----------
    const detectByBrightBlob = () => {
      const hist = new Array(256).fill(0);
      for (let i = 0; i < gray.length; i++) hist[Math.min(255, gray[i] | 0)]++;
      const total = gray.length;
      let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
      let sumB = 0, wB = 0, varMax = 0, otsu = 127;
      for (let t = 0; t < 256; t++) {
        wB += hist[t]; if (wB === 0) continue;
        const wF = total - wB; if (wF === 0) break;
        sumB += t * hist[t];
        const mB = sumB / wB, mF = (sum - sumB) / wF;
        const between = wB * wF * (mB - mF) * (mB - mF);
        if (between > varMax) { varMax = between; otsu = t; }
      }

      const largestComponent = (mask) => {
        const visited = new Uint8Array(SW * SH);
        const stack = new Int32Array(SW * SH);
        let best = null;
        for (let start = 0; start < SW * SH; start++) {
          if (!mask[start] || visited[start]) continue;
          let sp = 0;
          stack[sp++] = start; visited[start] = 1;
          let minX = SW, maxX = 0, minY = SH, maxY = 0, count = 0;
          while (sp > 0) {
            const cur = stack[--sp];
            const cx = cur % SW, cy = (cur / SW) | 0;
            count++;
            if (cx < minX) minX = cx; if (cx > maxX) maxX = cx;
            if (cy < minY) minY = cy; if (cy > maxY) maxY = cy;
            if (cx > 0) { const nb = cur - 1; if (mask[nb] && !visited[nb]) { visited[nb] = 1; stack[sp++] = nb; } }
            if (cx < SW - 1) { const nb = cur + 1; if (mask[nb] && !visited[nb]) { visited[nb] = 1; stack[sp++] = nb; } }
            if (cy > 0) { const nb = cur - SW; if (mask[nb] && !visited[nb]) { visited[nb] = 1; stack[sp++] = nb; } }
            if (cy < SH - 1) { const nb = cur + SW; if (mask[nb] && !visited[nb]) { visited[nb] = 1; stack[sp++] = nb; } }
          }
          if (!best || count > best.count) best = { minX, maxX, minY, maxY, count };
        }
        return best;
      };

      const evalPolarity = (brighterIsDoc) => {
        const mask = new Uint8Array(SW * SH);
        for (let i = 0; i < gray.length; i++) {
          mask[i] = brighterIsDoc ? (gray[i] > otsu ? 1 : 0) : (gray[i] < otsu ? 1 : 0);
        }
        const comp = largestComponent(mask);
        if (!comp) return null;
        const bboxW = comp.maxX - comp.minX + 1, bboxH = comp.maxY - comp.minY + 1;
        const bboxArea = bboxW * bboxH;
        const fillRatio = comp.count / bboxArea;
        const areaFrac = bboxArea / (SW * SH);
        const touchesAllEdges = comp.minX <= 1 && comp.maxX >= SW - 2 && comp.minY <= 1 && comp.maxY >= SH - 2;
        if (touchesAllEdges || fillRatio < 0.45 || areaFrac < 0.05 || areaFrac > 0.95) return null;
        return { left: comp.minX, top: comp.minY, right: comp.maxX, bottom: comp.maxY, area: areaFrac, score: fillRatio };
      };

      const bright = evalPolarity(true);
      const dark = evalPolarity(false);
      if (bright && dark) return bright.score >= dark.score ? bright : dark;
      return bright || dark || null;
    };

    const a = detectByBorderDiff();
    const b = detectByBrightBlob();

    let winner = null;
    if (a && b) winner = b.score >= a.score ? b : a; // metoda B (spójna plama) zwykle pewniejsza przy podobnym wyniku
    else winner = b || a;

    if (!winner) return null;
    return toFrac(winner);
  }

  function updateCropBoxStyle() {
    cropBox.style.left = (crop.left * 100) + '%';
    cropBox.style.top = (crop.top * 100) + '%';
    cropBox.style.width = ((crop.right - crop.left) * 100) + '%';
    cropBox.style.height = ((crop.bottom - crop.top) * 100) + '%';
  }

  function pointFromEvent(e) {
    const rect = cropShell.getBoundingClientRect();
    return {
      x: clamp((e.clientX - rect.left) / rect.width, 0, 1),
      y: clamp((e.clientY - rect.top) / rect.height, 0, 1)
    };
  }

  // corner-resize handles
  let activeCorner = null;
  document.querySelectorAll('.crop-handle').forEach(handle => {
    handle.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      activeCorner = handle.dataset.corner;
      handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener('pointermove', (e) => {
      if (!activeCorner) return;
      const p = pointFromEvent(e);
      // róg to para liter: t/b (góra/dół) + l/r (lewo/prawo)
      if (activeCorner.includes('l')) crop.left = clamp(p.x, 0, crop.right - MIN_SIZE);
      if (activeCorner.includes('r')) crop.right = clamp(p.x, crop.left + MIN_SIZE, 1);
      if (activeCorner.includes('t')) crop.top = clamp(p.y, 0, crop.bottom - MIN_SIZE);
      if (activeCorner.includes('b')) crop.bottom = clamp(p.y, crop.top + MIN_SIZE, 1);
      updateCropBoxStyle();
    });
    handle.addEventListener('pointerup', () => { activeCorner = null; });
    handle.addEventListener('pointercancel', () => { activeCorner = null; });
  });

  // move whole box
  let moving = false;
  let moveStart = null;
  let cropStart = null;
  cropBox.addEventListener('pointerdown', (e) => {
    if (e.target.classList.contains('crop-handle')) return;
    e.preventDefault();
    moving = true;
    moveStart = pointFromEvent(e);
    cropStart = { ...crop };
    cropBox.setPointerCapture(e.pointerId);
  });
  cropBox.addEventListener('pointermove', (e) => {
    if (!moving) return;
    const p = pointFromEvent(e);
    const dx = p.x - moveStart.x;
    const dy = p.y - moveStart.y;
    const w = cropStart.right - cropStart.left;
    const h = cropStart.bottom - cropStart.top;
    let left = clamp(cropStart.left + dx, 0, 1 - w);
    let top = clamp(cropStart.top + dy, 0, 1 - h);
    crop = { left, top, right: left + w, bottom: top + h };
    updateCropBoxStyle();
  });
  cropBox.addEventListener('pointerup', () => { moving = false; });
  cropBox.addEventListener('pointercancel', () => { moving = false; });

  cropApplyBtn.addEventListener('click', () => {
    const sx = crop.left * cropCanvas.width;
    const sy = crop.top * cropCanvas.height;
    const sw = (crop.right - crop.left) * cropCanvas.width;
    const sh = (crop.bottom - crop.top) * cropCanvas.height;

    const tmp = document.createElement('canvas');
    tmp.width = Math.max(1, Math.round(sw));
    tmp.height = Math.max(1, Math.round(sh));
    tmp.getContext('2d').drawImage(cropCanvas, sx, sy, sw, sh, 0, 0, tmp.width, tmp.height);

    const cropped = new Image();
    cropped.onload = () => {
      sourceImage = cropped;
      proceedToOptimize();
    };
    cropped.src = tmp.toDataURL('image/jpeg', 0.95);
  });

  cropSkipBtn.addEventListener('click', () => { proceedToOptimize(); });

  backToCropBtn.addEventListener('click', () => {
    if (!uncroppedImage) return;
    showCropStep(true); // zachowaj poprzednio ustawioną ramkę kadru
  });

  function proceedToOptimize() {
    showStep('optimize');
    stepIndicator.textContent = pages.length > 0 ? `KROK 2/3 · STRONA ${pages.length + 1}` : 'KROK 2/3';
    setFilter('bw'); // resetuje też suwak kontrastu
    refreshFilenamePreview();
    updateGenerateLabel();
    updateCarousel();
  }

  function updateGenerateLabel() {
    if (generateBtn.dataset.mode === 'reset') return; // nie nadpisuj stanu "Zrób nowy skan"
    generateBtn.textContent = pages.length > 0
      ? `Zakończ (${pages.length + 1} str.) i zapisz PDF`
      : 'Generuj PDF i zapisz';
  }

  function updateCarousel() {
    if (pages.length === 0) {
      pagesCarousel.style.display = 'none';
      return;
    }
    if (carouselIndex >= pages.length) carouselIndex = pages.length - 1;
    if (carouselIndex < 0) carouselIndex = 0;

    pagesCarousel.style.display = 'flex';
    carouselImg.src = pages[carouselIndex].dataUrl;
    carouselLabel.textContent = `Strona ${carouselIndex + 1} z ${pages.length}`;
    carouselPrev.disabled = carouselIndex === 0;
    carouselNext.disabled = carouselIndex === pages.length - 1;
  }

  carouselPrev.addEventListener('click', () => { carouselIndex--; updateCarousel(); });
  carouselNext.addEventListener('click', () => { carouselIndex++; updateCarousel(); });
  carouselDelBtn.addEventListener('click', () => {
    pages.splice(carouselIndex, 1);
    updateCarousel();
    updateGenerateLabel();
  });

  addPageBtn.addEventListener('click', () => {
    if (!sourceImage) return;
    pages.push({
      dataUrl: previewCanvas.toDataURL('image/jpeg', 0.92),
      width: previewCanvas.width,
      height: previewCanvas.height
    });
    carouselIndex = pages.length - 1;
    updateCarousel();
    goToCaptureStep(false);
    stepIndicator.textContent = `KROK 1/3 · STRONA ${pages.length + 1}`;
  });

  // ---------- image processing ----------
  function setFilter(name) {
    currentFilter = name;
    filterBtns.forEach(b => setOn(b, b.dataset.filter === name));
    contrastLabelText.textContent = name === 'bw' ? 'Czułość progu (skan)' : 'Kontrast';
    contrastSlider.value = 0;
    contrastValue.textContent = '0';
    renderPreview();
  }

  filterBtns.forEach(btn => { btn.addEventListener('click', () => setFilter(btn.dataset.filter)); });

  function renderPreview() {
    if (!sourceImage) return;
    const maxW = 1400;
    const scale = Math.min(1, maxW / sourceImage.naturalWidth);
    const w = Math.round(sourceImage.naturalWidth * scale);
    const h = Math.round(sourceImage.naturalHeight * scale);
    previewCanvas.width = w;
    previewCanvas.height = h;

    ctx.drawImage(sourceImage, 0, 0, w, h);

    if (currentFilter === 'bw') {
      // Adaptacyjna binaryzacja: każdy piksel porównywany jest do lokalnego (rozmytego)
      // tła, nie do jednego globalnego progu - dzięki temu tekst zostaje czarny na białym
      // nawet przy nierównym oświetleniu (cień na części kartki), tak jak w apkach skanera.
      // Domyślnie łagodniejsza niż poprzednio + płynne przejście na krawędziach liter,
      // żeby tekst pozostał czytelny zamiast "postrzępionego" twardego czarno-białego.
      const sensitivity = 0.075 + (Number(contrastSlider.value) * 0.0016); // ok. 0.01 .. 0.2
      applyAdaptiveBinarization(w, h, clamp(sensitivity, 0.01, 0.22));
    } else {
      const toGray = currentFilter === 'gray';
      const amount = clamp((toGray ? 25 : 0) + Number(contrastSlider.value), -250, 250);
      if (toGray || amount !== 0) {
        applyContrastBrightness(w, h, toGray, amount, toGray ? 6 : 0);
      }
    }
  }

  // Kontrast/jasność w trybach "Oryginał" i "Skala szarości" - formuła liniowa,
  // amount w zakresie ok. -255..255 (nie mnożnik!)
  function applyContrastBrightness(w, h, toGray, amount, brightness) {
    const imgData = ctx.getImageData(0, 0, w, h);
    const d = imgData.data;
    const factor = (259 * (amount + 255)) / (255 * (259 - amount));
    const adjust = (v) => clamp(factor * (v - 128) + 128 + brightness, 0, 255);
    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i + 1], b = d[i + 2];
      if (toGray) r = g = b = 0.299 * r + 0.587 * g + 0.114 * b;
      d[i] = adjust(r); d[i + 1] = adjust(g); d[i + 2] = adjust(b);
    }
    ctx.putImageData(imgData, 0, 0);
  }

  // Tryb "Skan Cz-B": binaryzacja adaptacyjna względem lokalnego tła.
  // Rozmycie tła liczone jest tanim trikiem: pomniejszenie obrazu (uśrednia sąsiedztwo),
  // potem powiększenie z wygładzaniem - to przybliżenie dużego rozmycia gaussowskiego.
  function applyAdaptiveBinarization(w, h, t) {
    const srcData = ctx.getImageData(0, 0, w, h);
    const src = srcData.data;

    const bw2 = Math.max(14, Math.round(w / 30));
    const bh2 = Math.max(14, Math.round(h / 30));
    const small = document.createElement('canvas');
    small.width = bw2; small.height = bh2;
    small.getContext('2d').drawImage(previewCanvas, 0, 0, bw2, bh2);

    const blurUp = document.createElement('canvas');
    blurUp.width = w; blurUp.height = h;
    const bctx = blurUp.getContext('2d');
    bctx.imageSmoothingEnabled = true;
    bctx.imageSmoothingQuality = 'high';
    bctx.drawImage(small, 0, 0, w, h);
    const blurData = bctx.getImageData(0, 0, w, h).data;

    const soft = 0.05; // szerokość płynnego przejścia wokół progu - zapobiega postrzępionym krawędziom
    const out = ctx.createImageData(w, h);
    const od = out.data;
    for (let i = 0; i < src.length; i += 4) {
      const origGray = 0.299 * src[i] + 0.587 * src[i + 1] + 0.114 * src[i + 2];
      const bgGray = 0.299 * blurData[i] + 0.587 * blurData[i + 1] + 0.114 * blurData[i + 2];
      const ratio = origGray / Math.max(1, bgGray);
      const lower = (1 - t) - soft, upper = (1 - t) + soft;
      let v;
      if (ratio <= lower) v = 0;
      else if (ratio >= upper) v = 255;
      else {
        const p = (ratio - lower) / (upper - lower);
        v = 255 * (p * p * (3 - 2 * p)); // smoothstep - łagodniejsze przejście niż liniowe
      }
      od[i] = v; od[i + 1] = v; od[i + 2] = v; od[i + 3] = 255;
    }
    ctx.putImageData(out, 0, 0);
  }

  let contrastDebounce = null;
  contrastSlider.addEventListener('input', () => {
    contrastValue.textContent = contrastSlider.value;
    clearTimeout(contrastDebounce);
    contrastDebounce = setTimeout(renderPreview, 40);
  });


  // Rysuje na canvasie wizualną kopię strony PDF (obraz + stempel) - bez zależności od
  // wbudowanej przeglądarki PDF, która nie działa w zagnieżdżonej ramce artefaktu.
  function renderPdfPreviewMock(d) {
    const k = 3.2; // mm -> px
    pdfPreviewCanvas.width = Math.round(d.pageW * k);
    pdfPreviewCanvas.height = Math.round(d.pageH * k);
    const pctx = pdfPreviewCanvas.getContext('2d');
    pctx.fillStyle = '#ffffff';
    pctx.fillRect(0, 0, pdfPreviewCanvas.width, pdfPreviewCanvas.height);

    const pageImg = new Image();
    pageImg.onload = () => {
      pctx.drawImage(pageImg, d.x * k, d.y * k, d.drawW * k, d.drawH * k);

      pctx.strokeStyle = '#dadce0';
      pctx.lineWidth = 0.25 * k;
      pctx.beginPath();
      pctx.moveTo(d.margin * k, (d.stampTop - 4) * k);
      pctx.lineTo((d.pageW - d.margin) * k, (d.stampTop - 4) * k);
      pctx.stroke();

      pctx.fillStyle = '#5f6368';
      pctx.font = `${10.5 * k}px "Space Mono", monospace`;
      pctx.textBaseline = 'alphabetic';

      const maxTextW = (d.pageW - d.margin * 2) * k;
      const fitLine = (text) => {
        if (pctx.measureText(text).width <= maxTextW) return text;
        let t = text;
        while (t.length > 3 && pctx.measureText(t + '...').width > maxTextW) t = t.slice(0, -1);
        return t + '...';
      };

      d.lines.forEach((text, i) => {
        pctx.fillText(fitLine(text), d.margin * k, (d.stampTop + i * STAMP_LINE_H) * k);
      });
    };
    pageImg.src = d.imgData;
  }

  // Linie stempla w stopce strony PDF - wspólne dla jsPDF i podglądu na canvasie
  const STAMP_LINE_H = 6; // mm
  function stampLines(s, pageNo) {
    const lines = [];
    if (s.pageTotal > 1) lines.push(`Strona ${pageNo} z ${s.pageTotal}`);
    if (s.category) lines.push(`Płatność: ${s.category}`);
    if (s.amountLine) lines.push(s.amountLine);
    if (s.oneDrive) lines.push(`OneDrive: ${s.oneDrive.label} → ${s.oneDrive.folder}`);
    lines.push(
      `Plik: ${s.filename}`,
      `Notatka: ${s.opis || '—'}`,
      `Zapisano (lokalnie): ${s.savedAt}`,
      `Zapisano (czas PL): ${s.savedAtPL}`
    );
    return lines;
  }

  // Czcionka do stopki PDF z pełnym wsparciem polskich znaków - jsPDF 'courier'
  // to standardowa czcionka PDF (WinAnsi) i nie ma w niej ą/ć/ę/ł/ń/ś/ź/ż, co
  // psuje też rozstaw liter (jsPDF nie zna szerokości brakującego znaku).
  const STAMP_FONT_URL = 'https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/spacemono/SpaceMono-Regular.ttf';
  const STAMP_FONT_NAME = 'SpaceMonoPL';
  let stampFontBase64Promise = null;
  function loadStampFontBase64() {
    if (!stampFontBase64Promise) {
      stampFontBase64Promise = fetch(STAMP_FONT_URL)
        .then(r => r.blob())
        .then(blob => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        }))
        .catch(() => null); // brak sieci - zostaniemy przy czcionce standardowej
    }
    return stampFontBase64Promise;
  }

  generateBtn.dataset.mode = 'generate';

  // ---------- PDF generation + save ----------
  generateBtn.addEventListener('click', async () => {
    if (generateBtn.dataset.mode === 'reset') {
      goToCaptureStep(true);
      return;
    }
    if (!sourceImage) return;
    generateBtn.disabled = true;
    showStatus('Generuję PDF…', '');
    stepIndicator.textContent = 'KROK 3/3';

    try {
      const { jsPDF } = window.jspdf;

      const allPages = [
        ...pages,
        { dataUrl: previewCanvas.toDataURL('image/jpeg', 0.92), width: previewCanvas.width, height: previewCanvas.height }
      ];
      const isMulti = allPages.length > 1;

      const filename = buildFilename();
      const nazwa = nazwaInput.value.trim() || 'Dokument';
      const opis = opisInput.value.trim();
      const now = new Date();
      const savedAt = `${fmtDate(now)} ${fmtTime(now)}:${pad(now.getSeconds())}`;
      const msSaveEnabled = supportsMSAL && selectedOneDriveSlot !== null && !!msalAccount;
      const oneDriveInfo = msSaveEnabled ? getActiveOneDriveInfo() : null;
      const stamp = {
        pageTotal: allPages.length, category: selectedCategory, amountLine: getAmountLine(),
        oneDrive: oneDriveInfo,
        filename, opis, savedAt,
        // sv-SE daje format YYYY-MM-DD HH:mm:ss niezależnie od strefy telefonu
        savedAtPL: now.toLocaleString('sv-SE', { timeZone: 'Europe/Warsaw' })
      };
      const lineCount = stampLines(stamp, 1).length;

      const pageW = 210, pageH = 297; // A4 mm
      const margin = 10;
      const footerH = STAMP_LINE_H * lineCount + 4; // miejsce na stempel, rośnie z liczbą linii
      const availW = pageW - margin * 2;
      const availH = pageH - margin * 2 - footerH;
      const stampTop = pageH - margin - footerH + 6;

      // obraz strony wpasowany w obszar nad stopką, wyśrodkowany w poziomie
      const place = (p) => {
        const ratio = p.width / p.height;
        let drawW = availW;
        let drawH = drawW / ratio;
        if (drawH > availH) { drawH = availH; drawW = drawH * ratio; }
        return { x: (pageW - drawW) / 2, y: margin, drawW, drawH };
      };

      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const keywords = filename + (selectedCategory ? `, ${selectedCategory}` : '');
      doc.setProperties({ title: nazwa, subject: opis, keywords, creator: 'Skaner dokumentów' });

      const stampFontBase64 = await loadStampFontBase64();
      let stampFont = 'courier';
      if (stampFontBase64) {
        doc.addFileToVFS('SpaceMonoPL.ttf', stampFontBase64);
        doc.addFont('SpaceMonoPL.ttf', STAMP_FONT_NAME, 'normal');
        stampFont = STAMP_FONT_NAME;
      }

      const fitOneLine = (text) => {
        const lines = doc.splitTextToSize(text, availW);
        return lines.length > 1 ? lines[0].replace(/.{3}$/, '...') : lines[0];
      };

      allPages.forEach((p, idx) => {
        if (idx > 0) doc.addPage();

        const { x, y, drawW, drawH } = place(p);
        doc.addImage(p.dataUrl, 'JPEG', x, y, drawW, drawH);

        doc.setDrawColor(218, 220, 224);
        doc.setLineWidth(0.2);
        doc.line(margin, stampTop - 4, pageW - margin, stampTop - 4);

        doc.setFont(stampFont, 'normal');
        doc.setFontSize(10.5);
        doc.setTextColor(95, 99, 104);

        stampLines(stamp, idx + 1).forEach((text, i) => {
          doc.text(fitOneLine(text), margin, stampTop + i * STAMP_LINE_H);
        });
      });

      const blob = doc.output('blob');
      previewPdfBtn.style.display = '';

      pagesNote.textContent = `Podgląd pokazuje ostatnią z ${allPages.length} stron dokumentu.`;
      pagesNote.style.display = isMulti ? '' : 'none';

      const lastPage = allPages[allPages.length - 1];
      renderPdfPreviewMock({
        imgData: lastPage.dataUrl, ...place(lastPage),
        pageW, pageH, margin, stampTop, lines: stampLines(stamp, allPages.length)
      });

      const localSaveEnabled = isOn(localSaveToggleBtn);
      if (!localSaveEnabled && !msSaveEnabled) {
        showStatus('Włącz przynajmniej jedną opcję zapisu (telefon lub Microsoft).', 'err');
        return;
      }

      const savedParts = [];
      if (localSaveEnabled && await saveFile(filename, blob)) savedParts.push('telefon');

      let msOk = false;
      if (msSaveEnabled) {
        try {
          await uploadToOneDrive(filename, blob);
          msOk = true;
          savedParts.push('OneDrive');
        } catch (e) {
          showStatus('Nie udało się wysłać do OneDrive.', 'err');
        }
      }

      if (savedParts.length > 0) {
        showStatus(`Zapisano (${savedParts.join(' + ')}): ${filename}${isMulti ? ` (${allPages.length} str.)` : ''}`, 'ok');
        generateBtn.textContent = 'Zrób nowy skan';
        generateBtn.classList.add('is-done');
        generateBtn.dataset.mode = 'reset';

        const amountNum = parseAmount(); // liczba (nie tekst), żeby Excel mógł ją formatować
        const logRow = {
          savedAt, filename, nazwa, opis, category: selectedCategory || '',
          amount: amountNum === null ? '' : amountNum, currency: amountNum === null ? '' : getSelectedCurrency(),
          pages: allPages.length,
          oneDriveLabel: oneDriveInfo ? oneDriveInfo.label : '',
          oneDriveFolder: oneDriveInfo ? oneDriveInfo.folder : ''
        };
        appendLocalLogEntry(logRow);
        if (isOn(emailToggleBtn)) {
          const addr = getEmailAddress();
          if (msalAccount && isValidEmail(addr)) {
            sendMailGraph(filename, blob, addr)
              .then(() => showStatus(`Zapisano i wysłano e-mailem: ${filename}`, 'ok'))
              .catch(() => openEmailDraft(filename)); // nie udało się przez Graph - zostaw szkic jako zapasową opcję
          } else {
            openEmailDraft(filename);
          }
        }
        if (msOk) {
          appendRowToOneDriveLog(logRow).catch(() => {
            showStatus('Zapisano, ale nie udało się dopisać do dziennika na OneDrive.', 'err');
          });
        }
      } else {
        showStatus('Nie udało się zapisać pliku. Spróbuj ponownie.', 'err');
      }
    } catch (err) {
      const code = err && err.code;
      if (code === 'declined') {
        showStatus('Zapis anulowany.', '');
      } else if (code === 'rate_limited') {
        showStatus('Spróbuj ponownie za chwilę.', 'err');
      } else {
        showStatus('Nie udało się zapisać pliku. Spróbuj ponownie.', 'err');
      }
    } finally {
      generateBtn.disabled = false;
    }
  });

  function showStatus(msg, kind) {
    statusMsg.textContent = msg;
    statusMsg.className = 'status' + (kind ? ' ' + kind : '');
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
